<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Space weather zone demo</title>
<style>
  body { margin: 0; background: #03040a; color: #ccd; font: 13px monospace; overflow: hidden; }
  canvas { display: block; }
  #ui { position: absolute; top: 8px; left: 8px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  input[type=range] { width: 200px; }
  #mix { width: 260px; }
  button { background: #111; color: #ccd; border: 1px solid #446; padding: 4px 8px; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <span>cloud</span>
  <input id="mix" type="range" min="0" max="1" step="0.001" value="0">
  <span>weather</span>
  <span id="val">0.00</span>
  <span>speed</span>
  <input id="speed" type="range" min="0" max="3" step="0.05" value="1">
  <span id="speedVal">1.00x</span>
  <button id="bandBtn">spawn band</button>
</div>
<script>
// ---------- 3D value noise (seeded by Math.random here; use a shared seed in-game) ----------
const P = new Uint8Array(256), V = new Float32Array(256);
{
  const p = [...Array(256).keys()];
  for (let i = 255; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [p[i], p[j]] = [p[j], p[i]]; }
  for (let i = 0; i < 256; i++) { P[i] = p[i]; V[i] = Math.random(); }
}
const h = (i, j, k) => V[P[(P[(P[i & 255] + j) & 255] + k) & 255]];
const lerp = (a, b, t) => a + (b - a) * t;
function vn(x, y, z) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  const fx = x - xi, fy = y - yi, fz = z - zi;
  const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy), w = fz * fz * (3 - 2 * fz);
  const x0 = xi, x1 = xi + 1, y0 = yi, y1 = yi + 1, z0 = zi, z1 = zi + 1;
  return lerp(
    lerp(lerp(h(x0, y0, z0), h(x1, y0, z0), u), lerp(h(x0, y1, z0), h(x1, y1, z0), u), v),
    lerp(lerp(h(x0, y0, z1), h(x1, y0, z1), u), lerp(h(x0, y1, z1), h(x1, y1, z1), u), v), w);
}
function fbm(x, y, z, oct) {
  let s = 0, n = 0, a = 0.5, f = 1;
  for (let i = 0; i < oct; i++) { s += a * vn(x * f, y * f, z * f); n += a; a *= 0.5; f *= 2.02; }
  return s / n;
}
const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

// ---------- fixed sampling (never changes, so existing pixels keep their history) ----------
const SAMPLE = { scale: 0.01, octaves: 4, wind: [8, 3], evo: 0.025 };
// wind speed at mix 0 is 50% higher than at mix 1 (cloud is fast, weather is slow)
const windScaleAt = mix => 1.5 - 0.5 * mix;

// ---------- evolution parameters for each end of the slider ----------
// Only these are slewed; they affect how the field evolves from now on, not past values.
const CLOUD   = { th: 0.52, k: 0.00, decay: 0.03 };
const WEATHER = { th: 0.55, k: 0.25, decay: 0.03 };

// ---------- setup ----------
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const off = document.createElement('canvas'), octx = off.getContext('2d');
const CELL = 4;
let GW = 0, GH = 0, img, W, T = 0, driftX = 0, driftY = 0, last = performance.now();

const mixInput = document.getElementById('mix'), mixVal = document.getElementById('val');
const speedInput = document.getElementById('speed'), speedVal = document.getElementById('speedVal');
let mixTarget = 0;   // what the slider asks for
let mix = 0;         // what the field is currently using, eased toward target
let cur = { ...CLOUD };
mixInput.oninput = () => { mixTarget = +mixInput.value; };
speedInput.oninput = () => { speedVal.textContent = (+speedInput.value).toFixed(2) + 'x'; };

function resize() {
  cv.width = innerWidth; cv.height = innerHeight;
  const nGW = Math.ceil(cv.width / CELL), nGH = Math.ceil(cv.height / CELL);
  if (W && (nGW !== GW || nGH !== GH)) {
    const nW = new Float32Array(nGW * nGH);  // keep the weather layer on resize
    const cw = Math.min(GW, nGW), ch = Math.min(GH, nGH);
    for (let y = 0; y < ch; y++) for (let x = 0; x < cw; x++) nW[y * nGW + x] = W[y * GW + x];
    W = nW;
  } else if (!W) W = new Float32Array(nGW * nGH);
  GW = nGW; GH = nGH;
  off.width = GW; off.height = GH;
  img = octx.createImageData(GW, GH);
}

// ---------- rare band crossing the whole map (fixed in the drift frame) ----------
// the stripe never moves by code: it is sampled at (x + driftX, y + driftY),
// so the wind drift alone carries it across. thickness varies along its length.
let bandActive = false, bandTimer = 6, bandNx = 1, bandNy = 0, bandC0 = 0, bandSeed = 0;
let bandThick = 10, bandMaxTh = 15;

function bandExtent() {
  let mn = Infinity, mx = -Infinity;
  for (const [cx, cy] of [[0, 0], [GW - 1, 0], [0, GH - 1], [GW - 1, GH - 1]]) {
    const p = cx * bandNx + cy * bandNy;
    if (p < mn) mn = p;
    if (p > mx) mx = p;
  }
  return [mn, mx];
}

function spawnBand() {
  const na = Math.atan2(SAMPLE.wind[1], SAMPLE.wind[0]) + (Math.random() - 0.5) * 0.3;
  bandNx = Math.cos(na); bandNy = Math.sin(na);
  const [, mx] = bandExtent();
  bandThick = 8 + Math.random() * 14;        // grid cells
  bandMaxTh = bandThick * 1.45 + 1;
  // sampling is (x + drift), so the pattern moves against the wind vector and
  // enters from the max-projection side; start just beyond it
  bandC0 = mx + 5 + (driftX * bandNx + driftY * bandNy);
  bandSeed = Math.random() * 1000;
  bandActive = true;
}

function bandValue(x, y) {
  if (!bandActive) return 0;
  const sx = x + driftX, sy = y + driftY;
  const dist = sx * bandNx + sy * bandNy - bandC0;
  if (dist <= -bandMaxTh || dist >= bandMaxTh) return 0;
  const s = -sx * bandNy + sy * bandNx;      // position along the stripe
  const th = bandThick * (0.45 + 0.75 * vn(s * 0.05 + bandSeed, 7.7, 0)
    + 0.25 * vn(s * 0.12 + bandSeed, 3.3, 0));
  const dd = dist - (vn(s * 0.08 + bandSeed, 3.3, 0) - 0.5) * th * 0.6;  // ragged edges
  const d = dd / (th * 0.5);
  if (d <= -1 || d >= 1) return 0;
  const a = 1 - d * d;
  return a * a * (0.65 + 0.35 * vn(s * 0.06 + bandSeed, 9.1, 0));
}

document.getElementById('bandBtn').onclick = spawnBand;
window.addEventListener('resize', resize);
resize();

// ---------- frame ----------
function frame(now) {
  const rawDt = Math.min(0.05, (now - last) / 1000); last = now;
  const dt = rawDt * +speedInput.value;      // speed drives animation AND generation
  T += dt;

  // ease the mix toward the slider target (about 2 seconds for a full sweep)
  mix += (mixTarget - mix) * Math.min(1, dt * 1.5);
  mixVal.textContent = mix.toFixed(2);

  // parametric blend of evolution rules; applied to new updates only
  cur.th    = lerp(CLOUD.th, WEATHER.th, mix);
  cur.k     = lerp(CLOUD.k, WEATHER.k, mix);
  cur.decay = lerp(CLOUD.decay, WEATHER.decay, mix);

  // cumulative drift: changing the mix changes the drift rate, never the offset
  const ws = windScaleAt(mix);
  driftX += SAMPLE.wind[0] * ws * dt;
  driftY += SAMPLE.wind[1] * ws * dt;

  if (!bandActive) { bandTimer -= dt; if (bandTimer <= 0) spawnBand(); }
  else {
    const [mn] = bandExtent();
    const mapC = bandC0 - (driftX * bandNx + driftY * bandNy);
    if (mapC < mn - bandMaxTh - 5) { bandActive = false; bandTimer = 15 + Math.random() * 20; }
  }

  const z = T * SAMPLE.evo, d = img.data;
  const oct = SAMPLE.octaves;

  for (let y = 0; y < GH; y++) {
    for (let x = 0; x < GW; x++) {
      const i = y * GW + x;
      const u = (x + driftX) * SAMPLE.scale;
      const w = (y + driftY) * SAMPLE.scale;
      const f = fbm(u, w, z, oct);

      // weather layer integrates noise change; with k=0 (pure cloud) it simply decays
      W[i] += dt * cur.k * (f - 0.5);
      W[i] *= 1 - dt * cur.decay;

      const weatherF = 0.5 + W[i] * 1.2 + (f - 0.5) * 0.4;
      const field = lerp(f, weatherF, mix) + bandValue(x, y) * 0.7;

      const a = smooth(cur.th - 0.06, cur.th + 0.06, field);
      const p = i * 4;
      if (a <= 0) { d[p + 3] = 0; continue; }
      const c = smooth(cur.th, cur.th + 0.25, field);
      d[p]     = lerp(60, 255, c);
      d[p + 1] = lerp(40, 140, c);
      d[p + 2] = lerp(140, 60, c);
      d[p + 3] = a * 170;
    }
  }

  octx.putImageData(img, 0, 0);
  ctx.fillStyle = '#03040a';
  ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(off, 0, 0, cv.width, cv.height);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
