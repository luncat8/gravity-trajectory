<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Red giant filament outflow</title>
<style>
  body { margin: 0; background: #05030a; color: #ccc; font: 13px monospace; overflow: hidden; }
  canvas { display: block; cursor: crosshair; }
  #hint { position: absolute; top: 8px; left: 8px; opacity: 0.6; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">click to move the star</div>
<script>
// ---------- 3D value noise ----------
const P = new Uint8Array(256), V = new Float32Array(256);
{
  const p = [...Array(256).keys()];
  for (let i = 255; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [p[i], p[j]] = [p[j], p[i]]; }
  for (let i = 0; i < 256; i++) { P[i] = p[i]; V[i] = Math.random(); }
}
const h = (i, j, k) => V[P[(P[(P[i & 255] + j) & 255] + k) & 255]];
const lerp = (a, b, t) => a + (b - a) * t;
function vn(x, y, z) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  const fx = x - xi, fy = y - yi, fz = z - zi;
  const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy), w = fz * fz * (3 - 2 * fz);
  return lerp(
    lerp(lerp(h(xi, yi, zi), h(xi + 1, yi, zi), u), lerp(h(xi, yi + 1, zi), h(xi + 1, yi + 1, zi), u), v),
    lerp(lerp(h(xi, yi, zi + 1), h(xi + 1, yi, zi + 1), u), lerp(h(xi, yi + 1, zi + 1), h(xi + 1, yi + 1, zi + 1), u), v), w);
}
function ridged(x, y, z, oct) {
  let s = 0, n = 0, a = 0.5, f = 1;
  for (let i = 0; i < oct; i++) {
    s += a * (1 - Math.abs(2 * vn(x * f, y * f, z * f) - 1));
    n += a; a *= 0.5; f *= 2.02;
  }
  return s / n;
}
const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

// ---------- parameters ----------
const CFG = {
  CELL: 4,
  coreR: 34,        // visible star radius (px)
  L: 380,           // fade length (px)
  outSpeed: 28,     // filament travel speed (px/s)
  s: 0.012,         // radial feature scale
  A: 1.6,           // angular lobes
  evo: 0.02,        // slow morph over time
  th: 0.6,          // threshold
  growTau: 8        // seconds for outflow to fill its radius
};

// ---------- setup ----------
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const off = document.createElement('canvas'), octx = off.getContext('2d');
let GW, GH, img, sx, sy, T = 0, last = performance.now(), maxR;

function resize() {
  cv.width = innerWidth; cv.height = innerHeight;
  GW = Math.ceil(cv.width / CFG.CELL); GH = Math.ceil(cv.height / CFG.CELL);
  off.width = GW; off.height = GH;
  img = octx.createImageData(GW, GH);
  maxR = Math.hypot(cv.width, cv.height) * 0.6;
  if (sx === undefined) { sx = cv.width * 0.5; sy = cv.height * 0.5; }
}
window.addEventListener('resize', resize);
cv.addEventListener('click', e => { sx = e.clientX; sy = e.clientY; T = 0; });
resize();

// ---------- frame ----------
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; T += dt;
  const d = img.data, C = CFG;
  const front = maxR * (1 - Math.exp(-T / C.growTau));   // outflow front grows over time

  for (let y = 0; y < GH; y++) {
    for (let x = 0; x < GW; x++) {
      const px = x * C.CELL, py = y * C.CELL;
      const dx = px - sx, dy = py - sy;
      const r = Math.hypot(dx, dy);
      const p = (y * GW + x) * 4;
      if (r < C.coreR) { d[p + 3] = 0; continue; }

      const th = Math.atan2(dy, dx);
      // polar noise: angle wraps smoothly, radius shifts outward over time
      const f = ridged(
        Math.cos(th) * C.A,
        Math.sin(th) * C.A,
        (r - C.outSpeed * T) * C.s + T * C.evo,
        3
      );

      const env = Math.exp(-r / C.L) * (1 - smooth(front - 60, front, r));
      const g = f * env * 1.5;
      const a = smooth(C.th - 0.05, C.th + 0.05, g);
      if (a <= 0) { d[p + 3] = 0; continue; }

      // hotter, brighter near the star; dimmer red-orange further out
      const c = smooth(C.th, C.th + 0.3, g);
      d[p]     = lerp(110, 255, c);
      d[p + 1] = lerp(25, 150, c);
      d[p + 2] = lerp(15, 60, c);
      d[p + 3] = a * 200;
    }
  }

  octx.putImageData(img, 0, 0);
  ctx.fillStyle = '#05030a';
  ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(off, 0, 0, cv.width, cv.height);

  // the giant body with a soft glow
  const glow = ctx.createRadialGradient(sx, sy, C.coreR * 0.6, sx, sy, C.coreR * 3);
  glow.addColorStop(0, 'rgba(255,90,40,0.6)');
  glow.addColorStop(1, 'rgba(255,60,20,0)');
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(sx, sy, C.coreR * 3, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#c8301c';
  ctx.beginPath(); ctx.arc(sx, sy, C.coreR, 0, Math.PI * 2); ctx.fill();

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
